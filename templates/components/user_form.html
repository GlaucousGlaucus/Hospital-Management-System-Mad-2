<script type="text/x-template" id="user-form-template">
    <section class="panel u-border-none surface-shadow-soft">
        <div class="panel-body pad-4 pad-lg-5">
            <div class="flex-row justify-between items-center space-b-4">
                <h2 class="title-size-md space-b-0">[[ formMeta.title ]]</h2>
                <button class="action-btn action-btn-ghost-primary" @click="navigate('/dashboard/')">Back</button>
            </div>
            <form @submit.prevent="submitActiveForm" class="layout-grid layout-gap-md">
                <div class="span-md-6">
                    <label class="form-label">Name</label>
                    <input class="field-control" type="text" v-model="activeForm.name" required>
                </div>
                <div class="span-md-6">
                    <label class="form-label">Email</label>
                    <input class="field-control" type="email" v-model="activeForm.email" required>
                </div>
                <div class="span-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input class="field-control" type="date" v-model="activeForm.dob" required>
                </div>
                <div class="span-md-6">
                    <label class="form-label">Contact</label>
                    <input class="field-control" type="text" v-model="activeForm.contact" required>
                </div>
                <div class="span-md-6">
                    <label class="form-label">Password <span class="text-muted" v-if="activeForm.id">(optional on edit)</span></label>
                    <input class="field-control" type="password" v-model="activeForm.password" :required="!activeForm.id && routeName !== 'profileForm'">
                </div>
                <div class="span-md-6" v-if="showDoctorFields">
                    <label class="form-label">Specialization</label>
                    <input class="field-control" type="text" v-model="activeForm.specialization">
                </div>
                <div class="span-md-6" v-if="showDoctorFields">
                    <label class="form-label">Department</label>
                    <select class="field-select" v-model="activeForm.department_id">
                        <option value="">Select Department</option>
                        <option v-for="department in departments" :key="'form-dept-' + department.id" :value="department.id">
                            [[ department.name ]]
                        </option>
                    </select>
                </div>
                <div class="span-12">
                    <button class="action-btn action-btn-solid" type="submit">[[ formMeta.submitLabel ]]</button>
                </div>
            </form>
        </div>
    </section>
</script>
