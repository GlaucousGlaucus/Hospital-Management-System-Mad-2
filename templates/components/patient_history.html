<script type="text/x-template" id="patient-history-template">
    <section class="panel u-border-none surface-shadow-soft">
        <div class="panel-body">
            <div class="flex-row justify-between items-start space-b-4 space-gap-md flex-wrap">
                <div>
                    <h2 class="title-size-md space-b-1">[[ patientHistory.patient.name ]]</h2>
                    <div class="text-muted">
                        Doctors: [[ patientHistory.doctor_names.join(', ') || 'None' ]]
                    </div>
                    <div class="text-muted">
                        Departments: [[ patientHistory.departments.join(', ') || 'None' ]]
                    </div>
                </div>
                <button class="action-btn action-btn-ghost-primary" @click="navigate('/dashboard/')">Back</button>
            </div>
            <div class="surface-outline surface-rounded-lg pad-3 space-b-4 surface-tint">
                <div class="flex-row justify-between items-start space-gap-md flex-wrap">
                    <div>
                        <h3 class="title-size-sm space-b-1">Treatment Exports</h3>
                        <p class="text-muted text-small space-b-0">
                            Queue a CSV for this patient's treatment history and download completed files.
                        </p>
                    </div>
                    <div class="flex-row flex-wrap space-gap-sm">
                        <button class="action-btn action-btn-ghost-primary" @click="startTreatmentExport" :disabled="!canQueueTreatmentExport()">Export as CSV</button>
                        <button class="action-btn action-btn-ghost-secondary" @click="loadExports(historyPatientId())">Refresh</button>
                    </div>
                </div>
                <div v-if="exportJobs.length" class="table-scroll space-t-3">
                    <table class="records-table cell-middle space-b-0">
                        <thead>
                        <tr>
                            <th>Created</th>
                            <th>Status</th>
                            <th>File</th>
                            <th>Completed</th>
                            <th class="text-right">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="exportJob in exportJobs" :key="'history-export-' + exportJob.id">
                            <td>[[ formatDateTime(exportJob.created_at) ]]</td>
                            <td>
                                <span class="status-pill" :class="exportStatusClass(exportJob.status)">[[ exportJob.status ]]</span>
                            </td>
                            <td>[[ exportJob.file_name || 'Pending generation' ]]</td>
                            <td>[[ formatDateTime(exportJob.completed_at) || 'Not completed' ]]</td>
                            <td class="text-right">
                                <a v-if="exportJob.download_url" class="action-btn action-btn-compact action-btn-ghost-success" :href="exportJob.download_url">Download</a>
                                <span v-else class="text-muted text-small">Waiting for completion</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p v-else class="text-muted text-small space-b-0 space-t-3">No exports generated for this patient yet.</p>
            </div>
            <div class="table-scroll">
                <table class="records-table cell-middle">
                    <thead>
                    <tr>
                        <th>Visit</th>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Diagnosis</th>
                        <th>Prescription</th>
                        <th>Medicines</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr v-for="visit in patientHistory.visits" :key="'visit-' + visit.appointment_id">
                        <td>[[ visit.no ]]</td>
                        <td>[[ formatDate(visit.date) ]]</td>
                        <td>[[ visit.doctor_name || 'N/A' ]]</td>
                        <td>[[ visit.diagnosis || 'N/A' ]]</td>
                        <td>[[ visit.prescription || 'N/A' ]]</td>
                        <td>
                            <div v-if="visit.medicines.length">
                                <div v-for="medicine in visit.medicines" :key="visit.appointment_id + '-' + medicine.name">
                                    [[ medicine.name ]] ([[ medicine.morning ]]/[[ medicine.afternoon ]]/[[ medicine.night ]])
                                </div>
                            </div>
                            <span v-else class="text-muted">None</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</script>
