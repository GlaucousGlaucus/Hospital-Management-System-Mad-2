{% extends "base.html" %}
{% block content %}

<h2 class="auth-title">Add Doctor</h2>

<form action="{{ url_for('admin.new_doctor') }}" method="POST" class="auth-form">

  <label>Full Name</label>
  <input type="text" name="name" placeholder="Dr. John Doe" required>

  <label>Email</label>
  <input type="email" name="email" placeholder="doctor@example.com" required>

  <label>Password</label>
  <input type="password" name="password" placeholder="Enter password" required>

  <label>Age</label>
  <input type="number" name="age" placeholder="35" required>

  <label>Contact</label>
  <input type="text" name="contact" placeholder="+91 98765 43210" required>

  <div class="collapsable-input-field">
    <label>Specialization</label>
    <input type="text" name="specialization" placeholder="Cardiology, Neurology, etc." required>

    <label>Department</label>
    <select name="department_id" required>
      <option value="">Select Department</option>
      {% for dept in departments %}
      <option value="{{ dept.id }}">{{ dept.name }}</option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="btn btn-filled">Create Doctor Account</button>

  <p class="alt-link">
    Return to <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
  </p>

</form>

{% endblock %}
