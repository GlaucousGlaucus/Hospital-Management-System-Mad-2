{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <h2>Sign Up</h2>
    <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <div id="doctor-fields" class="collapsable-input-field">
            <label>Specialization</label>
            <input type="text" name="specialization">

            <label>Department</label>
            <select id="department" name="specialization">
                <option value="">Select Department</option>
            </select>
        </div>

        <div id="patient-fields" class="collapsable-input-field">
            <label>Age</label>
            <input type="number" name="age">

            <label>Contact</label>
            <input type="text" name="contact">
        </div>

        <label>Role</label>
        <select id="role" name="role" required>
            <option value="" selected>Select Role</option>
            <option value="doctor">Doctor</option>
            <option value="patient">Patient</option>
        </select>

        <button type="submit" class="btn btn-filled">Create Account</button>

        <p class="alt-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </form>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const roleSelect = document.getElementById("role");
        const docFields = document.getElementById("doctor-fields");
        const patientFields = document.getElementById("patient-fields");

        function toggleSpecialization() {
            const is_doctor = roleSelect.value === "doctor";
            const is_patient = roleSelect.value === "patient";

            docFields.style.visibility = is_doctor ? "visible" : "collapse";
            docFields.querySelector("input").required = is_doctor;

            patientFields.style.visibility = is_patient ? "visible" : "collapse";
            patientFields.querySelector("input").required = is_patient;
        }

        toggleSpecialization();
        roleSelect.addEventListener("change", toggleSpecialization);
    });
</script>
{% endblock %}
