<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Therapeia dia Oikonomia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <ul class="navbar-menu">
                <li><a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a></li>
                <li><a href="/">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="navbar-actions">
                <a href="{{ url_for('auth_login.login') }}" class="btn btn-outline">Login</a>
                <a href="{{ url_for('auth_signup.signup') }}" class="btn btn-filled">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container" style="flex: 1;">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        function adjustContainerHeight() {
            const navbar = document.querySelector('.navbar');
            const container = document.querySelector('.container');
            const navbarHeight = navbar.offsetHeight;
            container.style.minHeight = `calc(100vh - ${navbarHeight}px)`;
        }

        window.addEventListener('load', adjustContainerHeight);
        window.addEventListener('resize', adjustContainerHeight);
    </script>

    <footer class="footer">
        &copy; 2025 Therapeia dia Oikonomia. All rights reserved.
    </footer>
</body>
</html>
