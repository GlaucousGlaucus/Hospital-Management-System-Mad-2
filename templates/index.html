<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CliniTrak</title>

    <!-- Bootstrap CSS (required framework for styling) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <!-- Project specific styles (can customize on top of Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Vue 3 via CDN (UI framework) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CliniTrak</a>
    </div>
</nav>

{% raw %}
<div id="app" class="container pb-5">
    <!-- Vue will control this area -->
    <div class="row">
        <div class="col-12 text-center mb-4">
            <h1 class="display-4">Manage Less. Care More.</h1>
            <p class="lead">Your complete hospital management solution.</p>
        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4" v-for="feature in features" :key="feature.title">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ feature.title }}</h5>
                    <p class="card-text">{{ feature.description }}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h2 class="h4 mb-3">Get Started</h2>
            <p class="text-muted mb-4">
                Use the existing login and signup pages while the API-first Vue UI is being expanded.
            </p>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="{{ url_for('auth_login.login') }}" class="btn btn-outline-primary btn-lg">
                    Login
                </a>
                <a href="{{ url_for('auth_signup.signup') }}" class="btn btn-primary btn-lg">
                    Sign Up
                </a>
            </div>
        </div>
    </div>
</div>
{% endraw %}

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                features: [
                    {
                        title: "Fast & Efficient",
                        description: "Reduce paperwork, avoid mistakes and speed up operations."
                    },
                    {
                        title: "Secure by Design",
                        description: "Role-based access to safeguard patient and hospital data."
                    },
                    {
                        title: "User Friendly",
                        description: "Clean, intuitive interface designed for all skill levels."
                    }
                ]
            };
        }
    }).mount("#app");
</script>

<!-- Bootstrap JS (optional, for interactive components) -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>
</body>
</html>
