                                v-text="authForm.user_type ? 'Login As ' + authForm.user_type.charAt(0).toUpperCase() + authForm.user_type.slice(1): 'Login'"

                            <input class="field-control" type="text" v-model="signupForm.name" required>
                        </div>
                        <div>

                            <input class="field-control" type="email" v-model="signupForm.email" required>

                        <div>
