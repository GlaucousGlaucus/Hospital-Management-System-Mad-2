<script type="text/x-template" id="department-details-template">
    <section class="panel u-border-none surface-shadow-soft">
        <div class="panel-body">
            <div class="flex-row justify-between items-start space-b-4 space-gap-md">
                <div>
                    <h2 class="title-size-md space-b-1">[[ selectedDepartment.department.name ]]</h2>
                    <p class="text-muted space-b-0">[[ selectedDepartment.department.description ]]</p>
                </div>
                <button class="action-btn action-btn-ghost-primary" @click="navigate('/dashboard/')">Back to Dashboard</button>
            </div>
            <div class="layout-grid layout-gap-md">
                <div class="span-lg-6" v-for="doctor in selectedDepartment.doctors" :key="'dept-doc-' + doctor.id">
                    <div class="surface-outline surface-rounded-lg pad-3 u-full-height">
                        <div class="text-strong">[[ doctor.name ]]</div>
                        <div class="text-muted">[[ doctor.specialization ]]</div>
                        <div class="text-small text-muted space-b-3">[[ doctor.contact ]]</div>
                        <button class="action-btn action-btn-ghost-primary action-btn-compact" @click="openAvailabilityModal(doctor.id, 'book')">Check Availability</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</script>
