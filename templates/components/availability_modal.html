<script type="text/x-template" id="availability-modal-template">
        <div v-if="availabilityModal.open" class="modal-overlay dialog-open" @click.self="closeAvailabilityModal">
            <div class="dialog-card card border-0" role="dialog" aria-modal="true" aria-labelledby="availability-title">
                <div class="card-body p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
                    <h2 id="availability-title" class="modal-title h4 mb-0">Doctor Availability</h2>
                    <button type="button" class="app-alert-close dialog-close" @click="closeAvailabilityModal" aria-label="Close modal">×</button>
                </div>
                <div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Date</th>
                                <th>Morning</th>
                                <th>Afternoon</th>
                                <th>Evening</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr v-for="slotRow in availabilityModal.schedule" :key="'modal-' + slotRow.date">
                                <td>[[ slotRow.date_display ]]</td>
                                <td>
                                    <button class="btn btn-sm w-100" :class="availabilityButtonClass(slotRow, 'morning')" :disabled="!slotRow.morning" @click="selectAvailability(slotRow.date, 'morning')">
                                        [[ slotRow.morning ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                                <td>
                                    <button class="btn btn-sm w-100" :class="availabilityButtonClass(slotRow, 'afternoon')" :disabled="!slotRow.afternoon" @click="selectAvailability(slotRow.date, 'afternoon')">
                                        [[ slotRow.afternoon ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                                <td>
                                    <button class="btn btn-sm w-100" :class="availabilityButtonClass(slotRow, 'evening')" :disabled="!slotRow.evening" @click="selectAvailability(slotRow.date, 'evening')">
                                        [[ slotRow.evening ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3" v-if="availabilityModal.selectedDate">
                        <label class="form-label">Visit Type</label>
                        <input class="form-control" type="text" v-model="availabilityModal.visitType" :disabled="availabilityModal.action !== 'book'">
                    </div>
                </div>
                <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
                    <button class="btn btn-theme-outline-secondary" @click="closeAvailabilityModal">Close</button>
                    <button class="btn btn-theme-primary" :disabled="!availabilityModal.selectedDate" @click="confirmAvailabilityAction">
                        [[ availabilityModal.action === 'reschedule' ? 'Reschedule Appointment' : 'Book Appointment' ]]
                    </button>
                </div>
                </div>
            </div>
        </div>
</script>
