{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <h2 class="dashboard-title">Update Patient History</h2>
    <div class="patient-info">
        <p><strong>Patient Name:</strong> {{ patient.name }}</p>
        <p><strong>Department:</strong> {{ department }}</p>
    </div>

    <form method="POST" class="auth-form" style="gap:1rem;">
        <div class="dashboard-section" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <div>
                <label>Visit Type</label>
                <input type="text" name="visit_type" placeholder="Checkup / Follow-up / Emergency">
            </div>

            <div>
                <label>Test Done</label>
                <input type="text" name="test_done" placeholder="Blood Test / X-Ray / ECG">
            </div>
        </div>

        <div>
            <label>Diagnosis</label>
            <textarea name="diagnosis" rows="2" placeholder="Enter diagnosis">{{ treatment.diagnosis or '' }}</textarea>
        </div>

        <div>
            <label>Prescription</label>
            <textarea name="prescription" rows="2" placeholder="Enter prescription">{{ treatment.prescription or '' }}</textarea>
        </div>

        <div>
            <label>Medicines</label>

            <div id="medicine-list" class="card-list"
                 style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">

                <p id="medicine-empty" class="empty-text">
                    No medicines added yet. Click “Add Medicine” to begin.
                </p>
            </div>

            <button type="button" class="btn btn-outline" id="add-medicine">Add Medicine</button>
        </div>

        <div>
            <label>Notes</label>
            <textarea name="notes" rows="2" placeholder="Additional remarks or observations">{{ treatment.notes or '' }}</textarea>
        </div>

        <div style="display:block; justify-content:flex-end; gap: 1rem; align-self: end">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline">Cancel</a>
            <button type="button" class="btn btn-outline" onclick="window.location.reload();">Reset</button>
            <button type="submit" class="btn btn-filled">Save</button>
        </div>
    </form>
</div>

<script>
    function updatePlaceholder() {
        const list = document.getElementById("medicine-list");
        const placeholder = document.getElementById("medicine-empty");
        placeholder.style.display = list.querySelector(".card-item") ? "none" : "block";
    }

    function createMedicineCard(name = "", m = 0, a = 0, n = 0) {
        const div = document.createElement("div");
        div.className = "card-item";

        div.innerHTML = `
            <input type="text" name="medicine_name[]" value="${name}" placeholder="Medicine Name">

            <div class="dose-row">
                <div class="dose-field">
                    <label>Morning</label>
                    <input type="number" name="dose_morning[]" min="0" max="3" value="${m}">
                </div>
                <div class="dose-field">
                    <label>Afternoon</label>
                    <input type="number" name="dose_afternoon[]" min="0" max="3" value="${a}">
                </div>
                <div class="dose-field">
                    <label>Night</label>
                    <input type="number" name="dose_night[]" min="0" max="3" value="${n}">
                </div>
            </div>

            <button type="button" class="btn btn-outline remove-btn"
                onclick="this.parentElement.remove(); updatePlaceholder();">
                Remove
            </button>
        `;

        return div;
    }

    function loadExistingMedicines() {
        const list = document.getElementById("medicine-list");
        const medicines = {{ medicines | tojson }}
        if (medicines.length > 0) {
            for (const med of medicines) {
                list.appendChild(
                    createMedicineCard(
                        med.name,
                        med.m,
                        med.a,
                        med.n
                    )
                );
            }
        }
        updatePlaceholder();
    }

    function setupAddMedicineButton() {
        document.getElementById("add-medicine").addEventListener("click", () => {
            const list = document.getElementById("medicine-list");
            list.appendChild(createMedicineCard("", 0, 0, 0));
            updatePlaceholder();
        });
    }

    window.addEventListener("DOMContentLoaded", () => {
        loadExistingMedicines();
        setupAddMedicineButton();
        updatePlaceholder();
    });
</script>

{% endblock %}
