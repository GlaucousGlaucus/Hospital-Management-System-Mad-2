{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <h2>Login</h2>

    <div class="role-selector">
        <button type="button" id="btn-doctor" class="role-btn">As a Doctor</button>
        <button type="button" id="btn-patient" class="role-btn">As a Patient</button>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="auth-form">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn btn-filled">Login</button>

        <p class="alt-link">
            Don’t have an account?
            <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
    </form>
</section>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const btnDoctor = document.getElementById("btn-doctor");
        const btnPatient = document.getElementById("btn-patient");

        function selectRole(role) {
            const isDoctor = role === "doctor";
            const isPatient = role === "patient";

            btnDoctor.classList.toggle("active", isDoctor);
            btnPatient.classList.toggle("active", isPatient);
        }

        btnDoctor.addEventListener("click", () => selectRole("doctor"));
        btnPatient.addEventListener("click", () => selectRole("patient"));
    });
</script>

{% endblock %}
