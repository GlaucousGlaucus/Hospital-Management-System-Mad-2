{% extends "base.html" %}
{% block content %}

<script type="module" src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<div class="dashboard">

    <h2 class="dashboard-title">
        Welcome {{ session.get('user_name', 'Admin') }}
    </h2>

    <!-- Search + Create -->
    <div class="dashboard-actions">
        <input type="text"
               class="dashboard-search"
               placeholder="Search for doctor, patients, departments, etc.">
        <button class="btn btn-filled">Search</button>

        <div class="create-buttons">
            <a href="{{ url_for('admin.new_doctor') }}" class="btn btn-outline">Add Doctor</a>
            <a href="{{ url_for('admin.new_patient') }}" class="btn btn-outline">Add Patient</a>
        </div>
    </div>

    <!-- Registered Doctors -->
    <section class="dashboard-section">
        <h3 class="collapsible">Registered Doctors</h3>
        <div class="collapsible-content">
            <div id="doctor-list" class="card-list">
            </div>
        </div>
    </section>

    <!-- Registered Patients -->
    <section class="dashboard-section">
        <h3 class="collapsible">Registered Patients</h3>
        <div class="collapsible-content">
            <div id="patient-list" class="card-list">
            </div>
        </div>
    </section>

    <!-- Upcoming Appointments -->
    <section class="dashboard-section">
        <h3 class="collapsible">Upcoming Appointments</h3>
        <div class="collapsible-content">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Patient History</th>
                    </tr>
                    </thead>
                    <tbody id="appointments-table">
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</div>

{% endblock %}
