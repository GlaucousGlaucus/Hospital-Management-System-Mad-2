{% extends "base_account_login.html" %}
{% block auth_section %}
<h2>Login</h2>

<div class="role-selector">
    <button type="button" id="btn-patient" class="role-btn">Patient</button>
    <button type="button" id="btn-doctor" class="role-btn">Doctor</button>
    <button type="button" id="btn-admin" class="role-btn">Admin</button>
</div>

<form action="{{ url_for('auth_login.login') }}" method="POST" class="auth-form">
    <input type="hidden" id="role" name="user_type" value="doctor">

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button id="btn-submit" type="submit" class="btn btn-filled">Login as Doctor</button>

    <p class="alt-link">
        Don’t have an account?
        <a href="{{ url_for('auth_signup.signup') }}">Sign up</a>
    </p>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const btnDoctor = document.getElementById("btn-doctor");
        const btnPatient = document.getElementById("btn-patient");
        const btnAdmin = document.getElementById("btn-admin");
        const submitBtn = document.getElementById("btn-submit");
        const roleInput = document.getElementById("role");

        function selectRole(role) {
            btnDoctor.classList.toggle("active", role === "doctor");
            btnPatient.classList.toggle("active", role === "patient");
            btnAdmin.classList.toggle("active", role === "admin");

            roleInput.value = role;
            submitBtn.textContent = `Login as ${role.charAt(0).toUpperCase() + role.slice(1)}`;
        }

        selectRole("patient");

        btnDoctor.addEventListener("click", () => selectRole("doctor"));
        btnPatient.addEventListener("click", () => selectRole("patient"));
        btnAdmin.addEventListener("click", () => selectRole("admin"));
    });
</script>

{% endblock %}
