<script type="text/x-template" id="patient-dashboard-template">
        <section class="layout-grid layout-gap-lg space-b-4">
            <div class="span-lg-6">
                <div class="panel u-border-none surface-shadow-soft u-full-height">
                    <div class="panel-body">
                        <h2 class="title-size-sm">Profile</h2>
                        <p class="space-b-1 text-strong">[[ dashboard.patient.name ]]</p>
                        <p class="text-muted space-b-1">[[ dashboard.patient.email ]]</p>
                        <p class="text-muted space-b-3">[[ dashboard.patient.contact ]]</p>
                        <div class="flex-row flex-wrap space-gap-sm">
                            <button class="action-btn action-btn-ghost-primary" @click="navigate('/patient/edit/profile')">Edit Profile</button>
                            <button class="action-btn action-btn-ghost-secondary" @click="openPatientHistory(dashboard.patient.id)">Medical History</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="span-lg-6">
                <div class="panel u-border-none surface-shadow-soft u-full-height">
                    <div class="panel-body">
                        <h2 class="title-size-sm space-b-3">Treatment Export</h2>
                        <p class="text-muted text-small space-b-3">
                            Queue a CSV with all treatments, diagnosis, doctor details, and appointment history.
                        </p>
                        <button class="action-btn action-btn-ghost-primary" @click="startTreatmentExport">Export as CSV</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft space-b-4">
            <div class="panel u-border-none surface-shadow-soft u-full-height">
                <div class="panel-body">
                    <h2 class="title-size-sm space-b-3">Upcoming Appointments</h2>
                    <div class="table-scroll">
                        <table class="records-table cell-middle">
                            <thead>
                            <tr>
                                <th>Doctor</th>
                                <th>Department</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th class="text-right">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr v-for="appt in dashboard.upcoming_appointments" :key="'patient-appt-' + appt.id">
                                <td>[[ appt.doctor.name ]]</td>
                                <td>[[ appt.doctor.department_name ]]</td>
                                <td>[[ formatDate(appt.date) ]]</td>
                                <td>[[ formatTime(appt.time) ]]</td>
                                <td class="text-right">
                                    <div class="flex-row justify-end flex-wrap space-gap-sm">
                                        <button class="action-btn action-btn-compact action-btn-ghost-secondary" @click="openAvailabilityModal(appt.doctor.id, 'reschedule', appt.id)">Reschedule</button>
                                        <button class="action-btn action-btn-compact action-btn-ghost-danger" @click="cancelAppointment(appt.id)">Cancel</button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft space-b-4">
            <div class="panel-body">
                <div class="flex-row justify-between items-center space-b-3">
                    <h2 class="title-size-sm space-b-0">CSV Export Jobs</h2>
                    <button class="action-btn action-btn-compact action-btn-ghost-secondary" @click="loadExports()">Refresh</button>
                </div>
                <div v-if="exportJobs.length" class="table-scroll">
                    <table class="records-table cell-middle">
                        <thead>
                        <tr>
                            <th>Created</th>
                            <th>Status</th>
                            <th>File</th>
                            <th class="text-right">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="exportJob in exportJobs" :key="'export-' + exportJob.id">
                            <td>[[ formatDateTime(exportJob.created_at) ]]</td>
                            <td>
                                <span class="status-pill" :class="exportStatusClass(exportJob.status)">[[ exportJob.status ]]</span>
                            </td>
                            <td>[[ exportJob.file_name || 'Pending generation' ]]</td>
                            <td class="text-right">
                                <a v-if="exportJob.download_url" class="action-btn action-btn-compact action-btn-ghost-success" :href="exportJob.download_url">Download</a>
                                <span v-else class="text-muted text-small">Waiting for completion</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p v-else class="text-muted space-b-0">No exports generated yet.</p>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft space-b-4">
            <div class="panel-body">
                <h2 class="title-size-sm space-b-3">Departments</h2>
                <div class="layout-grid layout-gap-md">
                    <div class="span-md-6 span-xl-4" v-for="department in dashboard.departments" :key="'dept-' + department.id">
                        <button class="action-btn action-btn-neutral department-tile text-left u-full-width u-full-height" @click="navigate('/patient/department/' + department.id)">
                            <span class="text-strong u-block">[[ department.name ]]</span>
                            <span class="text-muted text-small">Browse doctors and availability</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft">
            <div class="panel-body">
                <h2 class="title-size-sm space-b-3">Find Doctors</h2>
                <div class="layout-grid layout-gap-md space-b-4">
                    <div class="span-lg-4">
                        <input class="field-control" type="text" v-model="patientSearch.q" placeholder="Name, specialization, or department">
                    </div>
                    <div class="span-lg-3">
                        <select class="field-select" v-model="patientSearch.department">
                            <option value="">All departments</option>
                            <option v-for="department in departments" :key="'search-dept-' + department.id" :value="String(department.id)">
                                [[ department.name ]]
                            </option>
                        </select>
                    </div>
                    <div class="span-lg-2">
                        <select class="field-select" v-model="patientSearch.slot">
                            <option value="">Any slot</option>
                            <option value="morning">Morning</option>
                            <option value="afternoon">Afternoon</option>
                            <option value="evening">Evening</option>
                        </select>
                    </div>
                    <div class="span-lg-3">
                        <input class="field-control" type="date" v-model="patientSearch.date">
                    </div>
                </div>
                <div class="flex-row space-gap-sm space-b-4">
                    <button class="action-btn action-btn-solid" @click="runPatientSearch">Search Doctors</button>
                    <button class="action-btn action-btn-ghost-secondary" @click="resetPatientSearch">Reset</button>
                </div>
                <div class="layout-grid layout-gap-md">
                    <div class="span-lg-6" v-for="doctor in patientSearch.results" :key="'search-doc-' + doctor.id">
                        <div class="surface-outline surface-rounded-lg pad-3 u-full-height">
                            <div class="flex-row justify-between space-gap-md">
                                <div>
                                    <div class="text-strong">[[ doctor.name ]]</div>
                                    <div class="text-muted">[[ doctor.specialization ]]</div>
                                    <div class="text-small text-muted">[[ doctor.department_name ]]</div>
                                </div>
                                <div class="text-right text-small text-muted">
                                    <div>Age: [[ doctor.age || 'N/A' ]]</div>
                                    <div>[[ doctor.contact || 'No contact' ]]</div>
                                </div>
                            </div>
                            <div class="space-t-3">
                                <button class="action-btn action-btn-ghost-primary action-btn-compact" @click="openAvailabilityModal(doctor.id, 'book')">Check Availability</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
</script>
