<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Therapeia dia Oikonomia</title>
    <link rel="stylesheet" href="static/style.css" />
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <ul class="navbar-menu">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="hero">
    <h1 class="hero-title">Therapeia dia Oikonomia<br></h1>
    <h2 class="hero-subtitle">Healthcare Through Management</h2>
</div>

<script>
    function adjustHeroHeight() {
        const navbar = document.querySelector('.navbar');
        const hero = document.querySelector('.hero');
        const navbarHeight = navbar.offsetHeight;
        hero.style.minHeight = `calc(100vh - ${navbarHeight}px)`;
    }

    window.addEventListener('load', adjustHeroHeight);
    window.addEventListener('resize', adjustHeroHeight);
</script>

<footer class="footer">
    &copy; 2025 Therapeia dia Oikonomia. All rights reserved.
</footer>
</body>
</html>
