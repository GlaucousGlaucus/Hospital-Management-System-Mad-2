<script type="text/x-template" id="user-form-template">
    <section class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 mb-0">[[ formMeta.title ]]</h2>
                <button class="btn btn-outline-primary" @click="navigate('/dashboard/')">Back</button>
            </div>
            <form @submit.prevent="submitActiveForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input class="form-control" type="text" v-model="activeForm.name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" v-model="activeForm.email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input class="form-control" type="date" v-model="activeForm.dob" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Contact</label>
                    <input class="form-control" type="text" v-model="activeForm.contact" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password <span class="text-secondary" v-if="activeForm.id">(optional on edit)</span></label>
                    <input class="form-control" type="password" v-model="activeForm.password" :required="!activeForm.id && routeName !== 'profileForm'">
                </div>
                <div class="col-md-6" v-if="showDoctorFields">
                    <label class="form-label">Specialization</label>
                    <input class="form-control" type="text" v-model="activeForm.specialization">
                </div>
                <div class="col-md-6" v-if="showDoctorFields">
                    <label class="form-label">Department</label>
                    <select class="form-select" v-model="activeForm.department_id">
                        <option value="">Select Department</option>
                        <option v-for="department in departments" :key="'form-dept-' + department.id" :value="department.id">
                            [[ department.name ]]
                        </option>
                    </select>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">[[ formMeta.submitLabel ]]</button>
                </div>
            </form>
        </div>
    </section>
</script>
