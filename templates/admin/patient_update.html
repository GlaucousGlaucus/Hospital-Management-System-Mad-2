{% extends "base.html" %}
{% block content %}

<div class="auth-section">

  <h2>{{ "Edit Patient" if patient else "Add Patient" }}</h2>

  <form action="{{ url_for('admin.edit_patient', patient_id=patient.id) if patient else url_for('admin.new_patient') }}"
        method="POST"
        class="auth-form">

    <label>Full Name</label>
    <input type="text" name="name"
           placeholder="John Doe"
           value="{{ patient.name if patient else '' }}"
           required>

    <label>Email</label>
    <input type="email" name="email"
           placeholder="patient@example.com"
           value="{{ patient.email if patient else '' }}"
           required>

    {% if patient %}
    <label>New Password (leave blank to keep unchanged)</label>
    <input type="password" name="password" placeholder="Enter new password">
    {% else %}
    <label>Password</label>
    <input type="password" name="password"
           placeholder="Enter password"
           required>
    {% endif %}

    <label>Date of Birth</label>
    <input type="date" name="dob"
           value="{{ patient.dob.isoformat() if patient and patient.dob else '' }}"
           required>

    <label>Contact</label>
    <input type="text" name="contact"
           placeholder="+91 XXX XXX XXXX"
           value="{{ patient.contact if patient else '' }}"
           required>

    <button type="submit" class="btn btn-filled">
      {{ "Update Patient" if patient else "Create Patient Account" }}
    </button>

    <p class="alt-link">
      Return to <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
    </p>

  </form>

</div>
{% endblock %}
