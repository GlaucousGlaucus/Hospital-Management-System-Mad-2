<script type="text/x-template" id="availability-modal-template">
        <div v-if="availabilityModal.open" class="modal-overlay dialog-open" @click.self="closeAvailabilityModal">
            <div class="dialog-card availability-dialog-card" role="dialog" aria-modal="true" aria-labelledby="availability-title">
                <div class="dialog-header">
                    <h2 id="availability-title" class="dialog-title title-size-sm space-b-0">Doctor Availability</h2>
                    <button type="button" class="app-alert-close dialog-close" @click="closeAvailabilityModal" aria-label="Close modal">×</button>
                </div>
                <div class="dialog-body dialog-body-stack">
                    <div class="table-scroll">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th>Date</th>
                                <th>Morning</th>
                                <th>Afternoon</th>
                                <th>Evening</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr v-for="slotRow in availabilityModal.schedule" :key="'modal-' + slotRow.date">
                                <td>[[ slotRow.date_display ]]</td>
                                <td>
                                    <button class="action-btn action-btn-compact u-full-width" :class="availabilityButtonClass(slotRow, 'morning')" :disabled="!slotRow.morning" @click="selectAvailability(slotRow.date, 'morning')">
                                        [[ slotRow.morning ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                                <td>
                                    <button class="action-btn action-btn-compact u-full-width" :class="availabilityButtonClass(slotRow, 'afternoon')" :disabled="!slotRow.afternoon" @click="selectAvailability(slotRow.date, 'afternoon')">
                                        [[ slotRow.afternoon ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                                <td>
                                    <button class="action-btn action-btn-compact u-full-width" :class="availabilityButtonClass(slotRow, 'evening')" :disabled="!slotRow.evening" @click="selectAvailability(slotRow.date, 'evening')">
                                        [[ slotRow.evening ? 'Select' : 'Unavailable' ]]
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="space-t-3" v-if="availabilityModal.selectedDate">
                        <label class="form-label">Visit Type</label>
                        <input class="field-control" type="text" v-model="availabilityModal.visitType" :disabled="availabilityModal.action !== 'book'">
                    </div>
                </div>
                <div class="dialog-footer">
                    <button class="action-btn action-btn-ghost-secondary" @click="closeAvailabilityModal">Close</button>
                    <button class="action-btn action-btn-solid" :disabled="!availabilityModal.selectedDate" @click="confirmAvailabilityAction">
                        [[ availabilityModal.action === 'reschedule' ? 'Reschedule Appointment' : 'Book Appointment' ]]
                    </button>
                </div>
            </div>
        </div>
</script>
