{% extends "base.html" %}
{% block content %}

<section class="auth-section">

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block auth_section %}
    {% endblock %}
</section>

{% endblock %}
