<script src="{{ url_for('static', filename='js/doctor_dialog.js') }}"></script>

<div id="doctorModal" class="modal-overlay">
  <div class="modal-card">

    <div class="modal-header">
      <h3 id="doctorName"></h3>
    </div>

    <div class="modal-body">
      <div class="modal-body-left">
        <p class="doctor-subtext"><strong>Specialization:</strong> <span id="doctorSpecialization"></span></p>
        <p class="doctor-subtext"><strong>Age:</strong> <span id="doctorAge"></span></p>
        <p class="doctor-subtext"><strong>Contact:</strong> <span id="doctorContact"></span></p>
      </div>

      <div class="modal-body-right">
        <div class="doctor-avatar"></div>
      </div>
    </div>

    <div class="modal-footer">
      <a id="availabilityBtn" class="btn btn-filled"
         onclick="openAvailabilityModal(currentDoctor.id, {type: 'booking'})">
        Check Availability
      </a>
      <button class="btn btn-outline" onclick="closeDoctorModal()">Go Back</button>
    </div>

  </div>
</div>
