<script type="text/x-template" id="admin-dashboard-template">
        <section class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body">
                        <div class="text-muted small">Doctors</div>
                        <div class="metric-value fw-semibold">[[ dashboard.doctors.length ]]</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body">
                        <div class="text-muted small">Patients</div>
                        <div class="metric-value fw-semibold">[[ dashboard.patients.length ]]</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body">
                        <div class="text-muted small">Total Appointments</div>
                        <div class="metric-value fw-semibold">[[ dashboard.total_appointments ]]</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body">
                        <div class="text-muted small">Upcoming Appointments</div>
                        <div class="metric-value fw-semibold">[[ dashboard.upcoming_appointments.length ]]</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-lg-5">
                        <label class="form-label">Search doctors, patients, or appointments</label>
                        <input class="form-control" type="text" v-model="adminSearch.q" @keyup="runAdminSearch">
                    </div>
                    <div class="col-lg-7 d-flex flex-wrap gap-2">
                        <button class="btn btn-theme-outline-primary" @click="navigate('/admin/new/doctor')">Add Doctor</button>
                        <button class="btn btn-theme-outline-primary" @click="navigate('/admin/new/patient')">Add Patient</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <label class="form-label">Tools</label>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-theme-outline-secondary" @click="startBatchReport">Run Daily Batch Summary</button>
                    <button class="btn btn-theme-outline-secondary" @click="startDailyReminders">Run Daily Reminders</button>
                    <button class="btn btn-theme-outline-secondary" @click="startMonthlyActivityReport">Run Monthly Reports</button>
                </div>

                <div v-if="batchTask" class="mt-4 border rounded-4 p-3 surface-tint">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3">
                        <div>
                            <div class="fw-semibold">[[ batchTask.label || 'Batch Task' ]]</div>
                            <div class="small text-muted">Task ID: [[ batchTask.task_id ]]</div>
                        </div>
                        <span class="badge rounded-pill status-pill" :class="batchTaskStateClass(batchTask.state)">[[ batchTask.state ]]</span>
                    </div>
                    <div v-if="batchTask.error" class="text-danger small mt-3">[[ batchTask.error ]]</div>
                    <div v-if="batchTask.result" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-4 col-xl-2" v-for="item in batchTaskSummary(batchTask)" :key="batchTask.kind + '-' + item.label">
                                <div class="border rounded-4 p-3 h-100">
                                    <div class="text-muted small">[[ item.label ]]</div>
                                    <div class="fw-semibold">[[ item.value ]]</div>
                                </div>
                            </div>
                        </div>
                        <div v-if="batchTask.kind === 'daily-reminders' && batchTaskRows(batchTask).length" class="table-responsive mt-3">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Appointment</th>
                                    <th>Patient</th>
                                    <th>Channels</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="(taskRow, index) in batchTaskRows(batchTask)" :key="batchTaskRowKey(batchTask, taskRow, index)">
                                    <td>[[ taskRow.appointment_id ]]</td>
                                    <td>[[ taskRow.patient_name || taskRow.patient_id ]]</td>
                                    <td>[[ (taskRow.channels || []).join(', ') ]]</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div v-if="batchTask.kind === 'monthly-activity' && batchTaskRows(batchTask).length" class="table-responsive mt-3">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Doctor</th>
                                    <th>Email</th>
                                    <th>Appointments</th>
                                    <th>Delivered</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="(taskRow, index) in batchTaskRows(batchTask)" :key="batchTaskRowKey(batchTask, taskRow, index)">
                                    <td>[[ taskRow.doctor_name || taskRow.doctor_id ]]</td>
                                    <td>[[ taskRow.doctor_email ]]</td>
                                    <td>[[ taskRow.appointments ]]</td>
                                    <td>[[ taskRow.delivered ? 'Yes' : 'No' ]]</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                    <h2 class="card-title h5 mb-0">Doctors</h2>
                    <button class="btn btn-sm btn-theme-outline-primary" @click="navigate('/admin/new/doctor')">New Doctor</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="doctor in filteredAdminDoctors" :key="'doctor-' + doctor.id">
                            <td>[[ doctor.name ]]</td>
                            <td>[[ doctor.department_name || 'Unassigned' ]]</td>
                            <td>[[ doctor.contact ]]</td>
                            <td>
                                <span class="badge rounded-pill status-pill" :class="doctor.is_blacklisted ? 'status-pill-danger' : 'status-pill-success'">
                                    [[ doctor.is_blacklisted ? 'Blacklisted' : 'Active' ]]
                                </span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex flex-wrap justify-content-end gap-2">
                                    <button class="btn btn-sm btn-theme-outline-primary" @click="navigate('/admin/edit/doctor/' + doctor.id + '/')">Edit</button>
                                    <button class="btn btn-sm btn-theme-outline-warning" @click="toggleBlacklist('doctor', doctor.id, !doctor.is_blacklisted)">
                                        [[ doctor.is_blacklisted ? 'Restore' : 'Blacklist' ]]
                                    </button>
                                    <button class="btn btn-sm btn-theme-outline-danger" @click="deleteEntity('doctor', doctor.id)">Delete</button>
                                </div>
                            </td>
                        </tr>
                        <tr v-if="!filteredAdminDoctors.length">
                            <td colspan="5" class="text-center text-muted py-4">No doctors match the current search.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                    <h2 class="card-title h5 mb-0">Patients</h2>
                    <button class="btn btn-sm btn-theme-outline-primary" @click="navigate('/admin/new/patient')">New Patient</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="patient in filteredAdminPatients" :key="'patient-' + patient.id">
                            <td>[[ patient.name ]]</td>
                            <td>[[ patient.email ]]</td>
                            <td>
                                <span class="badge rounded-pill status-pill" :class="patient.is_blacklisted ? 'status-pill-danger' : 'status-pill-success'">
                                    [[ patient.is_blacklisted ? 'Blacklisted' : 'Active' ]]
                                </span>
                            </td>
                            <td class="text-end">
                                <div class="d-flex flex-wrap justify-content-end gap-2">
                                    <button class="btn btn-sm btn-theme-outline-primary" @click="navigate('/admin/edit/patient/' + patient.id)">Edit</button>
                                    <button class="btn btn-sm btn-theme-outline-secondary" @click="openPatientHistory(patient.id)">History</button>
                                    <button class="btn btn-sm btn-theme-outline-warning" @click="toggleBlacklist('patient', patient.id, !patient.is_blacklisted)">
                                        [[ patient.is_blacklisted ? 'Restore' : 'Blacklist' ]]
                                    </button>
                                    <button class="btn btn-sm btn-theme-outline-danger" @click="deleteEntity('patient', patient.id)">Delete</button>
                                </div>
                            </td>
                        </tr>
                        <tr v-if="!filteredAdminPatients.length">
                            <td colspan="4" class="text-center text-muted py-4">No patients match the current search.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <h2 class="card-title h5 mb-3">Upcoming Appointments</h2>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Department</th>
                            <th>Date</th>
                            <th>Time</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="appt in filteredAdminAppointments" :key="'upcoming-' + appt.id">
                            <td>[[ appt.patient.name ]]</td>
                            <td>[[ appt.doctor.name ]]</td>
                            <td>[[ appt.doctor.department_name ]]</td>
                            <td>[[ formatDate(appt.date) ]]</td>
                            <td>[[ formatTime(appt.time) ]]</td>
                        </tr>
                        <tr v-if="!filteredAdminAppointments.length">
                            <td colspan="5" class="text-center text-muted py-4">No appointments match the current search.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="card app-card">
            <div class="card-body">
                <h2 class="card-title h5 mb-3">Past Appointments</h2>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Department</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="appt in filteredAdminPastAppointments" :key="'past-' + appt.id">
                            <td>[[ appt.patient.name ]]</td>
                            <td>[[ appt.doctor.name ]]</td>
                            <td>[[ appt.doctor.department_name ]]</td>
                            <td>[[ formatDate(appt.date) ]]</td>
                            <td>[[ formatTime(appt.time) ]]</td>
                            <td>[[ appt.status ]]</td>
                        </tr>
                        <tr v-if="!filteredAdminPastAppointments.length">
                            <td colspan="6" class="text-center text-muted py-4">No past appointments match the current search.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
</script>
