<script type="text/x-template" id="department-details-template">
    <section class="card app-card">
        <div class="card-body p-4">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-start gap-3 mb-4">
                <div>
                    <h2 class="card-title h4 mb-1">[[ selectedDepartment.department.name ]]</h2>
                    <p class="text-muted mb-0">[[ selectedDepartment.department.description ]]</p>
                </div>
                <button class="btn btn-theme-outline-primary" @click="navigate('/dashboard/')">Back to Dashboard</button>
            </div>
            <div class="row g-3">
                <div class="col-lg-6" v-for="doctor in selectedDepartment.doctors" :key="'dept-doc-' + doctor.id">
                    <div class="border rounded-4 p-3 h-100">
                        <div class="fw-semibold">[[ doctor.name ]]</div>
                        <div class="text-muted">[[ doctor.specialization ]]</div>
                        <div class="small text-muted mb-3">[[ doctor.contact ]]</div>
                        <button class="btn btn-sm btn-theme-outline-primary" @click="openAvailabilityModal(doctor.id, 'book')">Check Availability</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</script>
