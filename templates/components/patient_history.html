<script type="text/x-template" id="patient-history-template">
    <section class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-4 gap-3 flex-wrap">
                <div>
                    <h2 class="h4 mb-1">[[ patientHistory.patient.name ]]</h2>
                    <div class="text-secondary">
                        Doctors: [[ patientHistory.doctor_names.join(', ') || 'None' ]]
                    </div>
                    <div class="text-secondary">
                        Departments: [[ patientHistory.departments.join(', ') || 'None' ]]
                    </div>
                </div>
                <button class="btn btn-outline-primary" @click="navigate('/dashboard/')">Back</button>
            </div>
            <div class="border rounded-4 p-3 mb-4 bg-light-subtle">
                <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                    <div>
                        <h3 class="h5 mb-1">Treatment Exports</h3>
                        <p class="text-secondary small mb-0">
                            Queue a CSV for this patient's treatment history and download completed files.
                        </p>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-primary" @click="startTreatmentExport" :disabled="!canQueueTreatmentExport()">Export as CSV</button>
                        <button class="btn btn-outline-secondary" @click="loadExports(historyPatientId())">Refresh</button>
                    </div>
                </div>
                <div v-if="exportJobs.length" class="table-responsive mt-3">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Created</th>
                            <th>Status</th>
                            <th>File</th>
                            <th>Completed</th>
                            <th class="text-end">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="exportJob in exportJobs" :key="'history-export-' + exportJob.id">
                            <td>[[ formatDateTime(exportJob.created_at) ]]</td>
                            <td>
                                <span class="badge" :class="exportStatusClass(exportJob.status)">[[ exportJob.status ]]</span>
                            </td>
                            <td>[[ exportJob.file_name || 'Pending generation' ]]</td>
                            <td>[[ formatDateTime(exportJob.completed_at) || 'Not completed' ]]</td>
                            <td class="text-end">
                                <a v-if="exportJob.download_url" class="btn btn-sm btn-outline-success" :href="exportJob.download_url">Download</a>
                                <span v-else class="text-secondary small">Waiting for completion</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p v-else class="text-secondary small mb-0 mt-3">No exports generated for this patient yet.</p>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Visit</th>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Diagnosis</th>
                        <th>Prescription</th>
                        <th>Medicines</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr v-for="visit in patientHistory.visits" :key="'visit-' + visit.appointment_id">
                        <td>[[ visit.no ]]</td>
                        <td>[[ formatDate(visit.date) ]]</td>
                        <td>[[ visit.doctor_name || 'N/A' ]]</td>
                        <td>[[ visit.diagnosis || 'N/A' ]]</td>
                        <td>[[ visit.prescription || 'N/A' ]]</td>
                        <td>
                            <div v-if="visit.medicines.length">
                                <div v-for="medicine in visit.medicines" :key="visit.appointment_id + '-' + medicine.name">
                                    [[ medicine.name ]] ([[ medicine.morning ]]/[[ medicine.afternoon ]]/[[ medicine.night ]])
                                </div>
                            </div>
                            <span v-else class="text-secondary">None</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</script>
