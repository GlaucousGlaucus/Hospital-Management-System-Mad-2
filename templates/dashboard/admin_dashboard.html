{% extends "base.html" %}
{% block content %}

<script type="module" src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<div class="dashboard">

    <div class="dashboard-actions">
        <input type="text"
               class="dashboard-search"
               placeholder="Search for doctor, patients, departments, etc.">
        <button class="btn btn-filled">Search</button>

        <div class="create-buttons">
            <a href="{{ url_for('admin.new_doctor') }}" class="btn btn-filled">Add Doctor</a>
        </div>
    </div>

    <section class="dashboard-section">
        <h3 class="collapsible" id="doctor-header">Registered Doctors</h3>
        <div class="collapsible-content">
            <div id="doctor-list" class="card-list">
            </div>
        </div>
    </section>

    <section class="dashboard-section">
        <h3 class="collapsible" id="patient-header">Registered Patients</h3>
        <div class="collapsible-content">
            <div id="patient-list" class="card-list">
            </div>
        </div>
    </section>

    <section class="dashboard-section">
        <h3 class="collapsible" id="upcoming-appt-header">Registered Patients</h3>
        <div class="collapsible-content">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Patient History</th>
                    </tr>
                    </thead>
                    <tbody id="appointments-table">
                    </tbody>
                </table>
            </div>
        </div>
    </section>


    <section class="dashboard-section">
        <h3 class="collapsible" id="past-appt-header">Past Appointments</h3>
        <div class="collapsible-content">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Patient History</th>
                    </tr>
                    </thead>
                    <tbody id="past-appointments-table"></tbody>
                </table>
            </div>
        </div>
    </section>

</div>

{% endblock %}
