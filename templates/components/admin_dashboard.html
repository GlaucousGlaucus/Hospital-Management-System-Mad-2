<script type="text/x-template" id="admin-dashboard-template">
        <section class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <span class="material-symbols-outlined admin-dashboard-metric-icon">stethoscope</span>

                        <div>
                            <div class="text-muted small">Doctors</div>
                            <div class="metric-value fw-semibold">[[ dashboard.doctors.length ]]</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <span class="material-symbols-outlined admin-dashboard-metric-icon">group</span>
                        <div>
                            <div class="text-muted small">Patients</div>
                            <div class="metric-value fw-semibold">[[ dashboard.patients.length ]]</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <span class="material-symbols-outlined admin-dashboard-metric-icon">calendar_month</span>
                        <div>
                            <div class="text-muted small">Total Appointments</div>
                            <div class="metric-value fw-semibold">[[ dashboard.total_appointments ]]</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card app-card h-100">
                    <div class="card-body d-flex align-items-center">
                        <span class="material-symbols-outlined admin-dashboard-metric-icon">event_upcoming</span>
                        <div>
                            <div class="text-muted small">Upcoming Appointments</div>
                            <div class="metric-value fw-semibold">[[ dashboard.upcoming_appointments.length ]]</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <label class="form-label">Tools</label>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-theme-outline-secondary dashboard-action-button" @click="startBatchReport">
                        <span class="material-symbols-outlined dashboard-action-button-icon">analytics</span>
                        <span>Run Daily Batch Summary</span>
                    </button>
                    <button class="btn btn-theme-outline-secondary dashboard-action-button" @click="startDailyReminders">
                        <span class="material-symbols-outlined dashboard-action-button-icon">notifications_active</span>
                        <span>Run Daily Reminders</span>
                    </button>
                    <button class="btn btn-theme-outline-secondary dashboard-action-button" @click="startMonthlyActivityReport">
                        <span class="material-symbols-outlined dashboard-action-button-icon">assessment</span>
                        <span>Run Monthly Reports</span>
                    </button>
                </div>

                <div v-if="batchTask" class="mt-4 border rounded-4 p-3 surface-tint">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3">
                        <div>
                            <div class="fw-semibold">[[ batchTask.label || 'Batch Task' ]]</div>
                            <div class="small text-muted">Task ID: [[ batchTask.task_id ]]</div>
                        </div>
                        <span class="badge rounded-pill status-pill" :class="batchTaskStateClass(batchTask.state)">[[ batchTask.state ]]</span>
                    </div>
                    <div v-if="batchTask.error" class="text-danger small mt-3">[[ batchTask.error ]]</div>
                    <div v-if="batchTask.result" class="mt-3">
                        <div class="row g-3">
                            <div class="col-md-4 col-xl-2" v-for="item in batchTaskSummary(batchTask)" :key="batchTask.kind + '-' + item.label">
                                <div class="border rounded-4 p-3 h-100">
                                    <div class="text-muted small">[[ item.label ]]</div>
                                    <div class="fw-semibold">[[ item.value ]]</div>
                                </div>
                            </div>
                        </div>
                        <div v-if="batchTask.kind === 'daily-reminders' && batchTaskRows(batchTask).length" class="table-responsive mt-3">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Appointment</th>
                                    <th>Patient</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="(taskRow, index) in batchTaskRows(batchTask)" :key="batchTaskRowKey(batchTask, taskRow, index)">
                                    <td>[[ taskRow.appointment_id ]]</td>
                                    <td>[[ taskRow.patient_name || taskRow.patient_id ]]</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div v-if="batchTask.kind === 'monthly-activity' && batchTaskRows(batchTask).length" class="table-responsive mt-3">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Doctor</th>
                                    <th>Email</th>
                                    <th>Appointments</th>
                                    <th>Delivered</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr v-for="(taskRow, index) in batchTaskRows(batchTask)" :key="batchTaskRowKey(batchTask, taskRow, index)">
                                    <td>[[ taskRow.doctor_name || taskRow.doctor_id ]]</td>
                                    <td>[[ taskRow.doctor_email ]]</td>
                                    <td>[[ taskRow.appointments ]]</td>
                                    <td>[[ taskRow.delivered ? 'Yes' : 'No' ]]</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-lg-5">
                        <label class="form-label">Search doctors, patients, or appointments</label>
                        <input class="form-control" type="text" v-model="adminSearch.q" @keyup="runAdminSearch" placeholder="Search doctors, patients, departments, or appointments">
                    </div>
                </div>
            </div>
        </section>

        <section class="card app-card mb-4">
            <details class="admin-section-toggle" open>
                <summary class="admin-section-summary">
                    <div class="admin-section-summary-content">
                        <span class="material-symbols-outlined admin-dashboard-section-icon">stethoscope</span>
                        <div>
                        <h2 class="card-title h5 mb-0">Doctors</h2>
                        <div class="small text-muted">Manage doctor accounts</div>
                        </div>
                    </div>
                </summary>
                <div class="card-body pt-0">
                    <div class="d-flex justify-content-end mb-3">
                        <button class="btn btn-sm btn-theme-outline-primary dashboard-action-button" @click="navigate('/admin/new/doctor')">
                            <span class="material-symbols-outlined dashboard-action-button-icon">person_add</span>
                            <span>New Doctor</span>
                        </button>
                    </div>
                    <div v-if="filteredAdminDoctors.length" class="admin-entity-grid">
                        <article
                            v-for="doctor in filteredAdminDoctors"
                            :key="'doctor-' + doctor.id"
                            class="admin-entity-card"
                            :class="{ 'admin-entity-card-blacklisted': doctor.is_blacklisted }"
                        >
                            <div class="admin-entity-card-header">
                                <span class="badge rounded-pill status-pill" :class="doctor.is_blacklisted ? 'status-pill-danger' : 'status-pill-success'">
                                    [[ doctor.is_blacklisted ? 'Blacklisted' : 'Active' ]]
                                </span>
                            </div>
                            <img class="admin-entity-avatar" src="{{ url_for('static', filename='Resources/logo.png') }}" alt="Profile placeholder">
                            <div class="admin-entity-name">[[ doctor.name ]]</div>
                            <div class="admin-entity-meta">[[ doctor.department_name || 'Unassigned' ]]</div>
                            <div class="admin-entity-meta">[[ doctor.contact || 'No contact provided' ]]</div>
                            <div class="admin-entity-actions">
                                <button class="btn btn-sm btn-theme-outline-primary dashboard-action-button" @click="navigate('/admin/edit/doctor/' + doctor.id + '/')">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">edit</span>
                                    <span>Edit</span>
                                </button>
                                <button class="btn btn-sm btn-theme-outline-warning dashboard-action-button" @click="toggleBlacklist('doctor', doctor.id, !doctor.is_blacklisted)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">block</span>
                                    <span>[[ doctor.is_blacklisted ? 'Restore' : 'Blacklist' ]]</span>
                                </button>
                                <button class="btn btn-sm btn-theme-outline-danger dashboard-action-button" @click="deleteEntity('doctor', doctor.id)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">delete</span>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </article>
                    </div>
                    <div v-else class="text-center text-muted py-4">
                        No doctors match the current search.
                    </div>
                </div>
            </details>
        </section>

        <section class="card app-card mb-4">
            <details class="admin-section-toggle" open>
                <summary class="admin-section-summary">
                    <div class="admin-section-summary-content">
                        <span class="material-symbols-outlined admin-dashboard-section-icon">group</span>
                        <div>
                        <h2 class="card-title h5 mb-0">Patients</h2>
                        <div class="small text-muted">Manage patient accounts</div>
                        </div>
                    </div>
                </summary>
                <div class="card-body pt-0">
                    <div class="d-flex justify-content-end mb-3">
                        <button class="btn btn-sm btn-theme-outline-primary dashboard-action-button" @click="navigate('/admin/new/patient')">
                            <span class="material-symbols-outlined dashboard-action-button-icon">person_add</span>
                            <span>New Patient</span>
                        </button>
                    </div>
                    <div v-if="filteredAdminPatients.length" class="admin-entity-grid">
                        <article
                            v-for="patient in filteredAdminPatients"
                            :key="'patient-' + patient.id"
                            class="admin-entity-card"
                            :class="{ 'admin-entity-card-blacklisted': patient.is_blacklisted }"
                        >
                            <div class="admin-entity-card-header">
                                <span class="badge rounded-pill status-pill" :class="patient.is_blacklisted ? 'status-pill-danger' : 'status-pill-success'">
                                    [[ patient.is_blacklisted ? 'Blacklisted' : 'Active' ]]
                                </span>
                            </div>
                            <img class="admin-entity-avatar" src="{{ url_for('static', filename='Resources/logo.png') }}" alt="Profile placeholder">
                            <div class="admin-entity-name">[[ patient.name ]]</div>
                            <div class="admin-entity-meta">[[ patient.email || 'No email provided' ]]</div>
                            <div class="admin-entity-actions">
                                <button class="btn btn-sm btn-theme-outline-primary dashboard-action-button" @click="navigate('/admin/edit/patient/' + patient.id)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">edit</span>
                                    <span>Edit</span>
                                </button>
                                <button class="btn btn-sm btn-theme-outline-secondary dashboard-action-button" @click="openPatientHistory(patient.id)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">history</span>
                                    <span>History</span>
                                </button>
                                <button class="btn btn-sm btn-theme-outline-warning dashboard-action-button" @click="toggleBlacklist('patient', patient.id, !patient.is_blacklisted)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">block</span>
                                    <span>[[ patient.is_blacklisted ? 'Restore' : 'Blacklist' ]]</span>
                                </button>
                                <button class="btn btn-sm btn-theme-outline-danger dashboard-action-button" @click="deleteEntity('patient', patient.id)">
                                    <span class="material-symbols-outlined dashboard-action-button-icon">delete</span>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </article>
                    </div>
                    <div v-else class="text-center text-muted py-4">
                        No patients match the current search.
                    </div>
                </div>
            </details>
        </section>

        <section class="card app-card mb-4">
            <details class="admin-section-toggle" open>
                <summary class="admin-section-summary">
                    <div class="admin-section-summary-content">
                        <span class="material-symbols-outlined admin-dashboard-section-icon">event_upcoming</span>
                        <div>
                        <h2 class="card-title h5 mb-0">Upcoming Appointments</h2>
                        <div class="small text-muted">Review scheduled appointments</div>
                        </div>
                    </div>
                </summary>
                <div class="card-body pt-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Department</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr v-for="appt in filteredAdminAppointments" :key="'upcoming-' + appt.id">
                                <td>[[ appt.patient.name ]]</td>
                                <td>[[ appt.doctor.name ]]</td>
                                <td>[[ appt.doctor.department_name ]]</td>
                                <td>[[ formatDate(appt.date) ]]</td>
                                <td>[[ formatTime(appt.time) ]]</td>
                                <td>[[ appt.status ]]</td>
                                <td class="text-end">
                                    <div class="d-flex flex-wrap justify-content-end gap-2">
                                        <button class="btn btn-sm btn-theme-outline-secondary dashboard-action-button" @click="openAvailabilityModal(appt.doctor.id, 'reschedule', appt.id)">
                                            <span class="material-symbols-outlined dashboard-action-button-icon">event_repeat</span>
                                            <span>Reschedule</span>
                                        </button>
                                        <button class="btn btn-sm btn-theme-outline-success dashboard-action-button" @click="markComplete(appt.id)">
                                            <span class="material-symbols-outlined dashboard-action-button-icon">task_alt</span>
                                            <span>Complete</span>
                                        </button>
                                        <button class="btn btn-sm btn-theme-outline-danger dashboard-action-button" @click="cancelAppointment(appt.id)">
                                            <span class="material-symbols-outlined dashboard-action-button-icon">cancel</span>
                                            <span>Cancel</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr v-if="!filteredAdminAppointments.length">
                                <td colspan="7" class="text-center text-muted py-4">No appointments match the current search.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </details>
        </section>

        <section class="card app-card">
            <details class="admin-section-toggle" open>
                <summary class="admin-section-summary">
                    <div class="admin-section-summary-content">
                        <span class="material-symbols-outlined admin-dashboard-section-icon">history</span>
                        <div>
                        <h2 class="card-title h5 mb-0">Past Appointments</h2>
                        <div class="small text-muted">Review completed and previous appointments</div>
                        </div>
                    </div>
                </summary>
                <div class="card-body pt-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Department</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr v-for="appt in filteredAdminPastAppointments" :key="'past-' + appt.id">
                                <td>[[ appt.patient.name ]]</td>
                                <td>[[ appt.doctor.name ]]</td>
                                <td>[[ appt.doctor.department_name ]]</td>
                                <td>[[ formatDate(appt.date) ]]</td>
                                <td>[[ formatTime(appt.time) ]]</td>
                                <td>[[ appt.status ]]</td>
                            </tr>
                            <tr v-if="!filteredAdminPastAppointments.length">
                                <td colspan="6" class="text-center text-muted py-4">No past appointments match the current search.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </details>
        </section>
</script>
