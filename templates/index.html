{% extends "base.html" %}

{% block content %}
<div class="hero">
    <h1 class="hero-title">Therapeia dia Oikonomia</h1>
    <h2 class="hero-subtitle">Healthcare Through Management</h2>

    <div class="hero-actions">
        {% if session.get('user_id') %}
        <h2 class="hero-subtitle">Hello {{ session['user_name'] }}</h2>
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-filled">Go to Dashboard</a>
        {% else %}
        <a href="{{ url_for('auth_login.login') }}" class="btn btn-outline">Login</a>
        <a href="{{ url_for('auth_signup.signup') }}" class="btn btn-filled">Sign Up</a>
        {% endif %}
    </div>
</div>

{% endblock %}
