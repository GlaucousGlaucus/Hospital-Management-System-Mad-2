{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <h2>Sign Up</h2>

    <div class="role-selector">
        <button type="button" id="btn-doctor" class="role-btn">As a Doctor</button>
        <button type="button" id="btn-patient" class="role-btn">As a Patient</button>
    </div>

    <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
        <input type="hidden" id="role" name="role" value="">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <div id="doctor-fields" class="collapsable-input-field">
            <label>Specialization</label>
            <input type="text" name="specialization">

            <label>Department</label>
            <select id="department" name="department">
                <option value="">Select Department</option>
            </select>
        </div>

        <div id="patient-fields" class="collapsable-input-field">
            <label>Age</label>
            <input type="number" name="age">

            <label>Contact</label>
            <input type="text" name="contact">
        </div>

        <button type="submit" class="btn btn-filled">Create Account</button>

        <p class="alt-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </form>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const btnDoctor = document.getElementById("btn-doctor");
        const btnPatient = document.getElementById("btn-patient");
        const docFields = document.getElementById("doctor-fields");
        const patientFields = document.getElementById("patient-fields");
        const roleInput = document.getElementById("role");

        function selectRole(role) {
            roleInput.value = role;

            const isDoctor = role === "doctor";
            const isPatient = role === "patient";

            btnDoctor.classList.toggle("active", isDoctor);
            btnPatient.classList.toggle("active", isPatient);

            docFields.classList.toggle("visible", isDoctor);
            patientFields.classList.toggle("visible", isPatient);

            docFields.querySelectorAll("input, select").forEach(el => el.required = isDoctor);
            patientFields.querySelectorAll("input").forEach(el => el.required = isPatient);
        }

        btnDoctor.addEventListener("click", () => selectRole("doctor"));
        btnPatient.addEventListener("click", () => selectRole("patient"));
    });
</script>
{% endblock %}
