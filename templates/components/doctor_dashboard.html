<script type="text/x-template" id="doctor-dashboard-template">
        <section class="layout-grid layout-gap-lg space-b-4">
            <div class="span-lg-4">
                <div class="panel u-border-none surface-shadow-soft u-full-height">
                    <div class="panel-body">
                        <h2 class="title-size-sm">Profile</h2>
                        <p class="space-b-1 text-strong">[[ dashboard.doctor.name ]]</p>
                        <p class="text-muted space-b-1">[[ dashboard.doctor.specialization ]]</p>
                        <p class="text-muted space-b-3">[[ dashboard.doctor.department_name ]]</p>
                        <button class="action-btn action-btn-ghost-primary" @click="navigate('/doctor/edit')">Edit Profile</button>
                    </div>
                </div>
            </div>
            <div class="span-lg-4">
                <div class="panel u-border-none surface-shadow-soft u-full-height">
                    <div class="panel-body">
                        <div class="text-muted text-small">Upcoming Appointments</div>
                        <div class="metric-value text-strong">[[ dashboard.upcoming_appointments.length ]]</div>
                    </div>
                </div>
            </div>
            <div class="span-lg-4">
                <div class="panel u-border-none surface-shadow-soft u-full-height">
                    <div class="panel-body">
                        <div class="text-muted text-small">Assigned Patients</div>
                        <div class="metric-value text-strong">[[ dashboard.patients.length ]]</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft space-b-4">
            <div class="panel-body">
                <h2 class="title-size-sm space-b-3">Upcoming Appointments</h2>
                <div class="table-scroll">
                    <table class="records-table cell-middle">
                        <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th class="text-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="appt in dashboard.upcoming_appointments" :key="'doc-appt-' + appt.id">
                            <td>[[ appt.patient.name ]]</td>
                            <td>[[ formatDate(appt.date) ]]</td>
                            <td>[[ formatTime(appt.time) ]]</td>
                            <td class="text-right">
                                <div class="flex-row justify-end flex-wrap space-gap-sm">
                                    <button class="action-btn action-btn-compact action-btn-ghost-primary" @click="navigate('/doctor/update_history/' + appt.id)">Update History</button>
                                    <button class="action-btn action-btn-compact action-btn-ghost-secondary" @click="openAvailabilityModal(appt.doctor.id, 'reschedule', appt.id)">Reschedule</button>
                                    <button class="action-btn action-btn-compact action-btn-ghost-success" @click="markComplete(appt.id)">Complete</button>
                                    <button class="action-btn action-btn-compact action-btn-ghost-danger" @click="cancelAppointment(appt.id)">Cancel</button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft space-b-4">
            <div class="panel-body">
                <h2 class="title-size-sm space-b-3">Assigned Patients</h2>
                <div class="layout-grid layout-gap-md">
                    <div class="span-md-6 span-xl-4" v-for="patient in dashboard.patients" :key="'doc-patient-' + patient.id">
                        <div class="surface-outline surface-rounded-lg pad-3 u-full-height">
                            <div class="text-strong">[[ patient.name ]]</div>
                            <div class="text-muted space-b-3">[[ patient.email ]]</div>
                            <button class="action-btn action-btn-ghost-primary action-btn-compact" @click="openPatientHistory(patient.id)">View History</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel u-border-none surface-shadow-soft">
            <div class="panel-body">
                <h2 class="title-size-sm space-b-3">Weekly Availability</h2>
                <div class="table-scroll">
                    <table class="records-table cell-middle">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Morning</th>
                            <th>Afternoon</th>
                            <th>Evening</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="slotRow in dashboard.availability" :key="'availability-' + slotRow.date">
                            <td>[[ slotRow.date_display ]]</td>
                            <td>
                                <button class="action-btn action-btn-compact u-full-width" :class="doctorAvailabilityButtonClass(slotRow.morning)" @click="toggleAvailability(slotRow.date, 'morning', !slotRow.morning)">
                                    [[ slotRow.morning ? 'Available' : 'Not available' ]]
                                </button>
                            </td>
                            <td>
                                <button class="action-btn action-btn-compact u-full-width" :class="doctorAvailabilityButtonClass(slotRow.afternoon)" @click="toggleAvailability(slotRow.date, 'afternoon', !slotRow.afternoon)">
                                    [[ slotRow.afternoon ? 'Available' : 'Not available' ]]
                                </button>
                            </td>
                            <td>
                                <button class="action-btn action-btn-compact u-full-width" :class="doctorAvailabilityButtonClass(slotRow.evening)" @click="toggleAvailability(slotRow.date, 'evening', !slotRow.evening)">
                                    [[ slotRow.evening ? 'Available' : 'Not available' ]]
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
</script>
