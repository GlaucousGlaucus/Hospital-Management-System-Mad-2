<script type="text/x-template" id="treatment-form-template">
    <section class="card app-card">
        <div class="card-body p-4 p-lg-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h2 class="card-title h4 mb-1">Update Patient History</h2>
                    <p class="text-muted mb-0">
                        [[ treatmentForm.appointment.patient.name ]] with [[ treatmentForm.appointment.doctor.name ]]
                    </p>
                </div>
                <button class="btn btn-theme-outline-primary" @click="navigate('/dashboard/')">Back</button>
            </div>
            <form @submit.prevent="submitTreatmentForm" class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Visit Type</label>
                    <input class="form-control" type="text" v-model="treatmentForm.visit_type">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Test Done</label>
                    <input class="form-control" type="text" v-model="treatmentForm.test_done">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Diagnosis</label>
                    <textarea class="form-control" rows="4" v-model="treatmentForm.diagnosis"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Prescription</label>
                    <textarea class="form-control" rows="4" v-model="treatmentForm.prescription"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Doctor Notes</label>
                    <textarea class="form-control" rows="3" v-model="treatmentForm.notes"></textarea>
                </div>
                <div class="col-12">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                        <h3 class="h5 mb-0">Medicines</h3>
                        <button class="btn btn-sm btn-theme-outline-primary" type="button" @click="addMedicineRow">Add Medicine</button>
                    </div>
                    <div class="d-flex flex-column gap-3">
                        <div class="border rounded-4 p-3" v-for="(medicine, index) in treatmentForm.medicines" :key="'medicine-' + index">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Name</label>
                                    <input class="form-control" type="text" v-model="medicine.name">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Morning</label>
                                    <input class="form-control" type="number" min="0" max="3" v-model.number="medicine.morning">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Afternoon</label>
                                    <input class="form-control" type="number" min="0" max="3" v-model.number="medicine.afternoon">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Night</label>
                                    <input class="form-control" type="number" min="0" max="3" v-model.number="medicine.night">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Days</label>
                                    <input class="form-control" type="number" min="1" v-model.number="medicine.duration_days">
                                </div>
                                <div class="col-md-10">
                                    <label class="form-label">Instructions</label>
                                    <input class="form-control" type="text" v-model="medicine.instructions">
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button class="btn btn-theme-outline-danger w-100" type="button" @click="removeMedicineRow(index)">Remove</button>
                                </div>
                            </div>
                        </div>
                        <p v-if="!treatmentForm.medicines.length" class="text-muted mb-0">No medicines added.</p>
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn btn-theme-primary" type="submit">Save History</button>
                </div>
            </form>
        </div>
    </section>
</script>
